version: 2

models:
  - name: stg_taxi_trips
    description: >
      One row per taxi trip, lightly cleaned: columns renamed to snake_case,
      types cast, passenger_count nulls defaulted to 1. No filtering of bad
      fares or distances happens here — that is the job of int_taxi_trips_cleaned.
    columns:
      - name: pickup_zone_id
        description: TLC zone ID where the trip started
        tests:
          - not_null
      - name: dropoff_zone_id
        description: TLC zone ID where the trip ended
        tests:
          - not_null
      - name: pickup_at
        description: Trip start timestamp
        tests:
          - not_null
      - name: dropoff_at
        description: Trip end timestamp
        tests:
          - not_null
      - name: fare_amount
        description: Metered fare in USD (raw — may include negative/zero values)
      - name: total_amount
        description: Total amount charged to the passenger

  - name: stg_taxi_zones
    description: One row per TLC taxi zone (265 zones across 5 boroughs).
    columns:
      - name: zone_id
        description: Primary key — TLC LocationID
        tests:
          - unique
          - not_null
      - name: borough
        description: NYC borough name (Manhattan, Brooklyn, Queens, Bronx, Staten Island)
        tests:
          - not_null
      - name: zone_name
        description: Human-readable neighbourhood name
